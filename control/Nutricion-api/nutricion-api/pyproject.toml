# pyproject.toml - Nutricion API

[tool.ruff]
# Longitud de línea compatible con Black
line-length = 100
target-version = "py310"

# Excluir directorios
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    "alembic",
]

[tool.ruff.format]
# Configuración del formateador
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Configuración para ordenar imports
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint]
# Reglas de linter
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]

ignore = [
    "E501",  # line too long (manejado por formatter)
    "E722",  # bare except (común en código legacy)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from (ok para HTTPException)
    "B007",  # unused loop variable
    "W191",  # indentation contains tabs
    "ARG001", # unused arguments (común en FastAPI dependencies)
    "ARG002", # unused method arguments
    "F841",  # unused variables (corregir gradualmente)
    "F601",  # dictionary key repeated (ya corregido)
    "C401",  # unnecessary generator (optimización menor)
    "C414",  # unnecessary list call
    "SIM102", # nested if (legibilidad)
    "SIM108", # ternary operator (legibilidad)
]

[tool.ruff.lint.per-file-ignores]
# Permitir imports no usados en __init__.py
"__init__.py" = ["F401"]
# Permitir prints en scripts
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Cambiar a true cuando tengas más tipos
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Configuración por módulo
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
