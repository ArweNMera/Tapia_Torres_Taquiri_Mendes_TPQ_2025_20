services:
  # Backend - API de Nutrición
  backend:
    build:
      context: ./control/Nutricion-api
      dockerfile: Dockerfile
      target: development  # Usa stage de desarrollo
    container_name: nutricion-backend
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: monta el código fuente
      - ./control/Nutricion-api/nutricion-api:/app
      # Credenciales de Firebase (solo lectura dentro del contenedor)
      - ${FIREBASE_CREDENTIALS_FILE:-./control/Nutricion-api/nutricion-api/firebase-credentials.json}:/secrets/firebase_credentials.json:ro
      # Variables de entorno de la API (reutilizamos el .env local)
      - ./control/Nutricion-api/nutricion-api/.env:/app/.env:ro
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_POST_LOGIN_REDIRECT=${GOOGLE_POST_LOGIN_REDIRECT}
      - GOOGLE_ALLOWED_REDIRECTS=${GOOGLE_ALLOWED_REDIRECTS}
      - ML_API_URL=http://modelo-ml:8080
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CREDENTIALS_PATH=/secrets/firebase_credentials.json
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS}
      - ML_SERVICE_URL=http://modelo-ml:8080
      - PYTHONUNBUFFERED=1  # Logs en tiempo real
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      modelo-ml:
        condition: service_healthy
    restart: unless-stopped
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend - React + Vite
  frontend:
    build:
      context: ./vista/AppSaludable
      dockerfile: Dockerfile
      target: development  # Usa stage de desarrollo
    container_name: nutricion-frontend
    ports:
      - "5175:5175"
    volumes:
      # Hot-reload: monta el código fuente
      - ./vista/AppSaludable:/app
      - /app/node_modules  # Evita sobrescribir node_modules
      # Variables de entorno del frontend (Vite toma este archivo)
      - ./vista/AppSaludable/.env:/app/.env:ro
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_API_VERSION=v1
      - VITE_TOKEN_KEY=auth_token
      - VITE_GOOGLE_POST_LOGIN_REDIRECT=http://localhost:5173
      - VITE_DEV_PORT=5173
      - VITE_DEV_HOST=0.0.0.0
      - VITE_OPEN_BROWSER=false
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5175"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Modelo ML - API de Machine Learning
  modelo-ml:
    build:
      context: ./modelo/ml-recomendator
      dockerfile: Dockerfile
      target: development  # Usa stage de desarrollo
    container_name: nutricion-modelo-ml
    ports:
      - "8001:8080"  # Mapea puerto 8001 del host al 8080 del contenedor
    volumes:
      # Hot-reload: monta el código fuente
      - ./modelo/ml-recomendator:/app
      # Persiste el modelo entrenado
      - ./modelo/ml-recomendator/models:/app/models
      - ./modelo/ml-recomendator/data:/app/data
    environment:
      - PORT=8080  # Puerto interno del contenedor
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-nutricion}
      - DATABASE_URL=mysql+pymysql://${DB_USER:-root}:${DB_PASSWORD}@${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-nutricion}
      - PYTHONUNBUFFERED=1  # Logs en tiempo real
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped
    # Límites de recursos (ML necesita más memoria)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
